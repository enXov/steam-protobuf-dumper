name: CI

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Create a release (builds all platforms and uploads artifacts)"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test

  build:
    name: Build (${{ matrix.target }})
    needs: check
    if: inputs.release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: steam-protobuf-dumper
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: steam-protobuf-dumper
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: steam-protobuf-dumper
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: steam-protobuf-dumper
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: steam-protobuf-dumper.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (native)
        if: "!matrix.cross"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../steam-protobuf-dumper-${{ matrix.target }}.tar.gz ${{ matrix.artifact }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../steam-protobuf-dumper-${{ matrix.target }}.zip ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: steam-protobuf-dumper-${{ matrix.target }}
          path: steam-protobuf-dumper-${{ matrix.target }}.*

  release:
    name: Release
    needs: build
    if: inputs.release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          generate_release_notes: true
          files: |
            steam-protobuf-dumper-*.tar.gz
            steam-protobuf-dumper-*.zip
