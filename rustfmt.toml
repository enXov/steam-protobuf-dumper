# ─── Rust formatting config ─────────────────────────────────────────────────
# Locked by cargo fmt. CI verifies adherence via:
#   cargo fmt --check
#
# See: https://rust-lang.github.io/rustfmt/

# Match the project's Rust edition.
edition = "2021"

# 100 columns for visual parity across the codebase.
max_width = 100

# Default indent is 4 spaces (rustfmt only supports 4 — this is here for clarity).
tab_spaces = 4

# Use `\n` line endings consistently.
newline_style = "Unix"
